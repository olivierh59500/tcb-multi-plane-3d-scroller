plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh59500.tcbscroller"
    compileSdk 36

    defaultConfig {
        applicationId "com.olivierh59500.tcbscroller"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libgojni.so"]
        }
    }
}

dependencies {
    implementation files("libs/tcbscroller.aar")
}
